name: mbewu_smart
description: "MbewuSmart - Crop disease detection app for Malawi farmers"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  fl_chart: ^0.69.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.2.1
  
  # AI/ML - TensorFlow Lite (prepared for disease detection model)
  # tflite_flutter: ^0.9.0  # Commented out - using placeholder

  # Image handling
  image_picker: ^1.0.4
  path_provider: ^2.1.4
  path: ^1.8.3
  flutter_image_compress: ^2.1.0

  # Location/GPS
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  
  # Firebase (optional sync, alerts, cloud storage)
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.7.0
  image: ^4.1.7
  
  # Dependency Injection
  get_it: ^7.6.4
  go_router: ^17.2.3
  dartz: ^0.10.1
  
  # Localization
  intl: ^0.20.2
  
  # Network & Utilities
  connectivity_plus: ^5.0.2
  uuid: ^4.2.1
  http: ^1.4.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^1.1.0
  
  # Text-to-Speech for voice prompts
  flutter_tts: ^3.8.5
  
  # URL Launcher for phone calls
  url_launcher: ^6.2.1
  
  # PDF generation & sharing (for WhatsApp report export)
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.0.2
  crypto: ^3.0.7
  bcrypt: ^1.2.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  
  # Launcher icon & splash screen generation
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/

# Launcher icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/mbewusmart_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/mbewusmart_logo_foreground.png"

# Native splash screen configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/mbewusmart_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icons/mbewusmart_logo_foreground.png
  android: true
  ios: false
  fullscreen: true

