name: mbewu_smart
description: "MbewuSmart - Crop disease detection app for Malawi farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.2.1
  
  # AI/ML - TensorFlow Lite (prepared for disease detection model)
  # tflite_flutter: ^0.9.0  # Commented out - using placeholder
  
  # Image handling
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Location/GPS
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  
  # Firebase (optional sync, alerts, cloud storage)
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  
  # Dependency Injection
  get_it: ^7.6.4
  go_router: ^14.6.2
  dartz: ^0.10.1
  
  # Localization
  intl: ^0.20.2
  
  # Network & Utilities
  connectivity_plus: ^5.0.2
  uuid: ^4.2.1
  http: ^1.4.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  
  # Text-to-Speech for voice prompts
  flutter_tts: ^3.8.5
  
  # URL Launcher for phone calls
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
